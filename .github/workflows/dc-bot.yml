name: Discord Announcement

on:
  push:
    branches:
      - main
    paths:
      - "announcement.md"
  workflow_dispatch:
    inputs:
      title:
        description: "Judul (kosongkan untuk pakai announcement.md)"
        required: false
      message:
        description: "Isi (kosongkan untuk pakai announcement.md)"
        required: false

jobs:
  send-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Discord webhook URL
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          URL="$(echo -n "$DISCORD_WEBHOOK_URL" | tr -d '[:space:]')"

          if [ -z "$URL" ]; then
            echo "Secret DISCORD_WEBHOOK_URL kosong atau tidak ditemukan."
            exit 1
          fi

          if [[ ! "$URL" =~ ^https://(discord|discordapp)\.com/api/webhooks/ ]]; then
            echo "Format webhook URL tidak valid."
            exit 1
          fi

          echo "Webhook URL valid."

      - name: Send announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
          ACTOR: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          url = "".join(os.environ["DISCORD_WEBHOOK_URL"].split())

          title = os.environ.get("INPUT_TITLE", "").strip()
          message = os.environ.get("INPUT_MESSAGE", "").strip()

          if not title:
              # Baca announcement.md: baris pertama = judul, sisanya = isi
              try:
                  with open("announcement.md", encoding="utf-8") as f:
                      text = f.read().strip()
              except FileNotFoundError:
                  print("File announcement.md tidak ditemukan.")
                  sys.exit(1)

              parts = text.split("\n", 1)
              title = parts[0].lstrip("# ").strip()
              message = parts[1].strip() if len(parts) > 1 else ""

          if not title:
              print("Judul announcement kosong.")
              sys.exit(1)

          embed = {
              "title": title[:256],
              "color": 5814783,
              "footer": {"text": f"Announcement oleh {os.environ.get('ACTOR', '')}"},
              "timestamp": datetime.now(timezone.utc).isoformat(),
          }
          if message:
              embed["description"] = message[:4000]

          payload = {"username": "Announcement", "embeds": [embed]}

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (github-actions, 1.0)",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("Discord response:", response.status)
          except urllib.error.HTTPError as e:
              print("Discord menolak request:", e.code)
              print(e.read().decode("utf-8", errors="replace"))
              sys.exit(1)
          PY
