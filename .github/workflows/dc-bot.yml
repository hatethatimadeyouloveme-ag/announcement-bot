name: Discord Announcement

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      title:
        description: "Judul announcement"
        required: false
        default: "🚀 Update terbaru"
      message:
        description: "Isi announcement"
        required: false
        default: "Project baru sudah siap"

jobs:
  send-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Discord webhook URL
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Buang spasi / enter yang tidak sengaja ikut ke-paste
          URL="$(echo -n "$DISCORD_WEBHOOK_URL" | tr -d '[:space:]')"

          if [ -z "$URL" ]; then
            echo "Secret DISCORD_WEBHOOK_URL kosong atau tidak ditemukan."
            echo "Buat di: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

          if [[ ! "$URL" =~ ^https://(discord|discordapp)\.com/api/webhooks/ ]]; then
            echo "Format webhook URL tidak valid."
            echo "Contoh yang benar: https://discord.com/api/webhooks/ID/TOKEN"
            exit 1
          fi

          echo "Webhook URL valid."

      - name: Send announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TITLE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.title || format('🚀 Push to {0}', github.ref_name) }}
          MESSAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.message || format('Commit by {0}', github.actor) }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          url = "".join(os.environ["DISCORD_WEBHOOK_URL"].split())
          title = os.environ.get("TITLE", "GitHub Update")
          message = os.environ.get("MESSAGE", "Update terbaru")
          repo = os.environ.get("REPO", "")
          branch = os.environ.get("BRANCH", "")
          actor = os.environ.get("ACTOR", "")
          sha = os.environ.get("SHA", "")[:7]

          payload = {
              "username": "GitHub Bot",
              "embeds": [
                  {
                      "title": title,
                      "description": message,
                      "color": 5814783,
                      "fields": [
                          {"name": "Repository", "value": repo, "inline": True},
                          {"name": "Branch", "value": branch, "inline": True},
                          {"name": "Author", "value": actor, "inline": True},
                          {"name": "Commit", "value": sha, "inline": True},
                      ],
                      "footer": {"text": "GitHub Actions Notification"},
                  }
              ],
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  # Tanpa User-Agent, Discord sering menolak request Python (HTTP 403)
                  "User-Agent": "DiscordBot (github-actions, 1.0)",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("Discord response:", response.status)
          except urllib.error.HTTPError as e:
              print("Discord menolak request:", e.code)
              print(e.read().decode("utf-8", errors="replace"))
              sys.exit(1)
          PY
