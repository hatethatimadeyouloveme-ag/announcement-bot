name: Discord Announcement

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      title:
        description: "Judul announcement"
        required: false
      message:
        description: "Isi announcement"
        required: false

jobs:
  send-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Discord webhook URL
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          URL="$(echo -n "$DISCORD_WEBHOOK_URL" | tr -d '[:space:]')"

          if [ -z "$URL" ]; then
            echo "Secret DISCORD_WEBHOOK_URL kosong atau tidak ditemukan."
            exit 1
          fi

          if [[ ! "$URL" =~ ^https://(discord|discordapp)\.com/api/webhooks/ ]]; then
            echo "Format webhook URL tidak valid."
            exit 1
          fi

          echo "Webhook URL valid."

      - name: Send announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          url = "".join(os.environ["DISCORD_WEBHOOK_URL"].split())
          event = os.environ.get("EVENT", "")

          if event == "workflow_dispatch":
              # Jalankan manual: pakai isian form (kalau kosong, pakai teks cadangan)
              title = os.environ.get("INPUT_TITLE", "").strip() or "📢 Announcement"
              message = os.environ.get("INPUT_MESSAGE", "").strip()
          else:
              # Push: baris pertama commit = judul, sisanya = isi
              commit = os.environ.get("COMMIT_MSG", "").strip()
              parts = commit.split("\n", 1)
              title = parts[0].strip() or "📢 Announcement"
              message = parts[1].strip() if len(parts) > 1 else ""

          embed = {
              "title": title[:256],
              "color": 5814783,
              "footer": {"text": f"oleh {os.environ.get('ACTOR', '')}"},
          }
          if message:
              embed["description"] = message[:4000]

          payload = {"username": "GitHub Bot", "embeds": [embed]}

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (github-actions, 1.0)",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("Discord response:", response.status)
          except urllib.error.HTTPError as e:
              print("Discord menolak request:", e.code)
              print(e.read().decode("utf-8", errors="replace"))
              sys.exit(1)
          PY
